spring.application.name=Progetto
sping.datasource.url=jdbc:mysql://localhost:3306/database_mysql.sql
spring.datasource.username=adminadmin
spring.datasource.password=admin
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:other/database_mysql.sql