<div *ngIf="isLoading">
  <p>Caricamento acquisti...</p>
</div>

<div *ngIf="errorMessage">
  <div class="alert alert-danger">{{ errorMessage }}</div>
</div>

<div *ngIf="!isLoading && !errorMessage">
  <div class="container py-4">
    <h2 class="mb-4">Le tue vendite</h2>

    <div class="row g-3">
      <div class="col-md-12 mb-4" *ngFor="let sale of sales">
        <div class="card shadow-sm border-0" style="background-color: #f9f9f9;">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="card-title mb-0 fw-bold text-dark">
                Vendita #{{ sale.id }}
              </h5>
              <label>
                <input
                  type="checkbox"
                  [checked]="sale.check"
                  (change)="toggleCheck(sale)"
                />
                Visualizzato
              </label>
              <small class="text-muted">{{ sale.date | date: 'medium' }}</small>
            </div>

            <hr class="my-2">

            <div class="d-flex justify-content-between">
              <span class="fw-semibold">Guadagno totale della vendita:</span>
              <span class="text-success fw-bold">
                {{ sale.totalPrice | currency: 'EUR' }}
              </span>
            </div>

            <div class="d-flex justify-content-between">
              <span class="fw-semibold">Spedire gli oggetti al seguente indirizzo:</span>
              <span >
                {{ sale.shippingAddress }}
              </span>
            </div>

            <ul class="list-group list-group-flush mt-3">
              <li class="list-group-item px-0 py-1" *ngFor="let prod of sale.products">
                {{ prod.name }} &times; {{ prod.quantity }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
