<div *ngIf="!isLoading && cartItems.length > 0">
  <h2>Il tuo carrello</h2>

  <div *ngFor="let item of cartItems" style="
    border: 1px solid #ccc;
    margin-bottom: 10px;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;">

    <div>
      <strong style="font-size: 1.2em">{{ item.name }}</strong><br>
      <small>Prezzo unitario: €{{ item.price }}</small><br>
      <small>Totale: €{{ item.price * item.quantity | number:'1.2-2' }}</small>
    </div>

    <div style="display: flex; align-items: center; gap: 10px">
      <button class="btn btn-primary btn-sm" (click)="decreaseQuantity(item.id)">-</button>
      <span>{{ item.quantity }}</span>
      <button class="btn btn-primary btn-sm" (click)="increaseQuantity(item.id)">+</button>
      <button class="btn btn-outline-danger btn-sm" (click)="removeItem(item.id)">Rimuovi</button>
    </div>
  </div>

  <div style="margin-top: 20px">
    <strong>Totale: €{{ totalAmount | number:'1.2-2' }}</strong>
    <button class="btn btn-outline-danger btn-sm" (click)="emptyCart()">Svuota carrello</button>
  </div>

  <div style="margin-top: 20px">
    <h3>Effettua l'ordine</h3>
    <label>
      Indirizzo Spedizione:<br>
      <input class="form-control" [(ngModel)]="indirizzoSpedizione" placeholder="Via/Piazza...">
    </label><br><br>

    <label>
      Metodo di pagamento:
      <select class="form-select" [(ngModel)]="metodoPagamento">
        <option value="1">Carta di Credito</option>
        <option value="2">PayPal</option>
      </select>
    </label><br><br>

    <button class="btn btn-success w-100" (click)="placeOrder()">Ordina</button>
  </div>
</div>

<div *ngIf="!isLoading && cartItems.length === 0">
  <h3>Il tuo carrello è vuoto</h3>
  <p>Aggiungi prodotti per iniziare.</p>
</div>
