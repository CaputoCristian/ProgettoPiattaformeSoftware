<div class="container py-4">
  <h3 *ngIf="!isLoading && products.length > 0">Risultati della ricerca:</h3>

  <div *ngIf="isLoading" class="text-center">Caricamento...</div>
  <div *ngIf="!isLoading && products.length === 0">Nessun prodotto trovato.</div>

  <div class="row" *ngIf="!isLoading">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card shadow-sm h-100 border-0" style="background-color: #f2f2f2">
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title mb-0 fw-bold text-dark">
              {{ product.name }}
            </h5>
            <small class="text-muted">{{ product.brand }}</small>
          </div>

          <hr>
          <small class="text-muted">{{ product.description }}</small>
          <hr>

          <div class="mt-3">
            <div class="d-flex justify-content-between">
              <span class="fw-semibold">Disponibilità:</span>
              <span>{{ product.quantity }}</span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="fw-semibold">Prezzo:</span>
              <span>€ {{ product.price | number: '1.2-2' }}</span>
            </div>
          </div>

          <button
            class="btn btn-primary mt-3 w-100"
            (click)="addToCart(product.id)"
          >
            Aggiungi al carrello
          </button>

        </div>
    </div>
  </div>
</div>
