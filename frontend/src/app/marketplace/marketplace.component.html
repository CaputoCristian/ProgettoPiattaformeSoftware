<div class="container">

  <h2>Marketplace</h2>

  <!-- Messaggio di caricamento -->
  <div *ngIf="isLoading">Caricamento prodotti...</div>

  <!-- Messaggio di errore -->
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <!-- Bottone per aggiungere un nuovo prodotto -->
  <button (click)="addProduct()">➕ Aggiungi nuovo prodotto</button>

  <hr>

  <!-- Form per aggiunta o modifica -->
  <div *ngIf="selectedProduct">
    <h3>{{ isEditMode ? 'Modifica Prodotto' : 'Nuovo Prodotto' }}</h3>

    <label>
      Nome:
      <input type="text" [(ngModel)]="selectedProduct.name">
    </label>
    <br>

    <label>
      Descrizione:
      <input type="text" [(ngModel)]="selectedProduct.description">
    </label>
    <br>

    <label>
      Prezzo (€):
      <input type="number" step="0.01" [(ngModel)]="selectedProduct.price">
    </label>
    <br>

    <label>
      Quantità:
      <input type="number" step="0.01" [(ngModel)]="selectedProduct.quantity">
    </label>
    <br>

    <label>
      Marca:
      <input type="text" step="0.01" [(ngModel)]="selectedProduct.brand">
    </label>
    <br>

    <button (click)="saveProduct()">💾 Salva</button>
    <button (click)="cancelEdit()">❌ Annulla</button>
  </div>

  <hr>

  <!-- Lista prodotti -->
  <div *ngFor="let prodotto of prodotti" class="product-card">

    <!-- Prodotto in modalità visualizzazione -->
    <div *ngIf="!selectedProduct || selectedProduct.id !== prodotto.id">
      <h4>{{ prodotto.name }}</h4>
      <p>{{ prodotto.description }}</p>
      <p>Prezzo: {{ prodotto.price }}€</p>

      <button (click)="editProduct(prodotto)">✏️ Modifica</button>
      <button (click)="deleteProduct(prodotto.id)">🗑️ Elimina</button>
    </div>

  </div>

</div>
