<nav class="navbar navbar-expand-lg navbar-dark bg-black">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Home
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" routerLink="/user">Profile</a></li>
            <li><a class="dropdown-item" routerLink="/purchase">Purchases</a></li>
            <li><a class="dropdown-item" routerLink="/sales">Sales Dashboard</a></li>
            <li><a class="dropdown-item" routerLink="/review">Reviews</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" routerLink="/shop">My Marketplace</a>
        </li>
      </ul>
      <form class="d-flex align-items-center gap-2" (ngSubmit)="onSearch()">
        <!-- Campo principale di ricerca -->
        <input
          type="text"
          class="form-control"
          [(ngModel)]="searchService.searchQuery"
          name="q"
          placeholder="Cerca prodotti..."
          required
        />

        <!-- Dropdown dei filtri -->
        <div class="dropdown">
          <button class="btn btn-outline-light dropdown-toggle" type="button" id="filterDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            Filtri
          </button>
          <ul class="dropdown-menu dropdown-menu-end p-3" aria-labelledby="filterDropdown" style="min-width: 250px;">
            <li class="mb-2">
              <label for="minPrice" class="form-label">Prezzo Minimo</label>
              <input type="number" id="minPrice" class="form-control" [(ngModel)]="searchService.minPrice" name="minPrice">
            </li>
            <li class="mb-2">
              <label for="maxPrice" class="form-label">Prezzo Massimo</label>
              <input type="number" id="maxPrice" class="form-control" [(ngModel)]="searchService.maxPrice" name="maxPrice">
            </li>
            <li class="form-check mb-2">
              <input class="form-check-input" type="checkbox" [(ngModel)]="searchService.availableOnly" name="availableOnly" id="availableOnly">
              <label class="form-check-label" for="availableOnly">
                Solo disponibili
              </label>
            </li>
          </ul>
        </div>

        <button class="btn btn-outline-light" type="submit">Cerca</button>
      </form>

      <li class="nav-item">
        <button class="btn btn-outline-light" (click)="logout()">Logout</button>
      </li>
    </div>
  </div>
</nav>


<div class="main-container">
  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <div class="cart" *ngIf="isLoggedIn">
    <app-cart></app-cart>
  </div>
</div>
