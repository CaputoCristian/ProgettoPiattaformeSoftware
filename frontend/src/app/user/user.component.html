<div *ngIf="isLoading">
  <p>Caricamento profilo...</p>
</div>

<div *ngIf="errorMessage">
  <p>{{ errorMessage }}</p>
</div>

<div *ngIf="!isLoading && !errorMessage">
  <div class="profile-card">
    <div class="header">
      <img src="assets/avatar.png" class="avatar" />
      <div>
        <h3>{{ userProfile.firstName }} {{ userProfile.lastName }}</h3>
        <p>{{ userProfile.email }}</p>
      </div>
    </div>

    <form *ngIf="userProfile" (ngSubmit)="saveChanges()">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" [(ngModel)]="editableProfile.firstName" name="firstName" [disabled]="!isEditing" />
      </div>
      <div class="form-group">
        <label>Cognome</label>
        <input type="text" [(ngModel)]="editableProfile.lastName" name="lastName" [disabled]="!isEditing" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="editableProfile.email" name="email" [disabled]="true" />
      </div>
      <div class="form-group">
        <label>Telefono</label>
        <input type="text" [(ngModel)]="editableProfile.telephoneNumber" name="telephoneNumber" [disabled]="!isEditing" />
      </div>
      <div class="form-group">
        <label>Indirizzo</label>
        <input type="text" [(ngModel)]="editableProfile.address" name="address" [disabled]="!isEditing" />
      </div>
      <div class="form-group">
        <label>Data di nascita</label>
        <input type="date" [(ngModel)]="editableProfile.birthDate" name="birthDate" [disabled]="!isEditing" />
      </div>

      <div class="button-group">
        <button type="button" *ngIf="!isEditing" (click)="enableEdit()">Modifica</button>
        <button type="submit" *ngIf="isEditing">Conferma</button>
        <button type="button" *ngIf="isEditing" (click)="cancelEdit()">Annulla</button>
      </div>
    </form>
  </div>

</div>
